<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/app-icon-512.png" />
    <link rel="preload" as="image" href="/brand/fitlife-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000503" />
    <meta
      name="description"
      content="FitLife — Plus qu'une application, un véritable accompagnement vers ta meilleure version. Ton corps. Ton alimentation. Ton coach."
    />
    <title>FitLife — Ton corps. Ton alimentation. Ton coach.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Écran de chargement : un anneau vert se dessine autour du coureur (logo), qui apparaît
      avec un rebond ; les lettres « FitLife » montent une à une, puis le slogan.
      Démarre seulement quand le logo est décodé ; main.tsx le retire à la fin. Un toucher passe.
    -->
    <style>
      html, body { margin: 0; background: #060807; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(55% 40% at 50% 42%, rgba(34, 197, 94, 0.16), transparent 70%), #060807;
        transition: opacity 0.45s ease, transform 0.45s ease; -webkit-tap-highlight-color: transparent;
        font-family: 'Space Grotesk', 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      #splash.leaving { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #splash .emblem { position: relative; width: 156px; height: 156px; }
      #splash .emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
      #splash .track { fill: none; stroke: rgba(34, 197, 94, 0.14); stroke-width: 5; }
      #splash .arc { fill: none; stroke: url(#splash-grad); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; }
      #splash .mark {
        position: absolute; inset: 26px; width: calc(100% - 52px); height: calc(100% - 52px); object-fit: contain;
        opacity: 0; transform: scale(0.4) rotate(-12deg); filter: drop-shadow(0 0 18px rgba(34, 197, 94, 0.55));
      }
      #splash .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(34, 197, 94, 0.6); opacity: 0; }
      #splash .word { display: flex; font-size: 46px; font-weight: 700; font-style: italic; letter-spacing: -0.02em; line-height: 1; }
      #splash .word span { display: inline-block; opacity: 0; transform: translateY(26px); color: #ffffff; }
      #splash .word span.g { color: #22C55E; }
      #splash .tag { margin: 0; color: rgba(255, 255, 255, 0.55); font: 600 13px 'Manrope', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.04em; opacity: 0; }
      #splash .hint {
        position: absolute; bottom: 36px; left: 0; right: 0; margin: 0; text-align: center; opacity: 0;
        font: 600 11px 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255, 255, 255, 0.25);
        transition: opacity 0.6s ease 1.2s;
      }
      #splash.go .hint { opacity: 1; }
      #splash.go .arc { animation: sp-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      #splash.go .mark { animation: sp-pop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s forwards; }
      #splash.go .pulse { animation: sp-pulse 1s ease-out 1.05s forwards; }
      #splash.go .word span { animation: sp-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(0.95s + var(--i) * 0.06s); }
      #splash.go .tag { animation: sp-fade 0.6s ease 1.55s forwards; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-pop { to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes sp-pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
      @keyframes sp-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes sp-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash.go .arc, #splash.go .mark, #splash.go .word span, #splash.go .tag { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="presentation" aria-label="Chargement de FitLife">
      <div class="stage">
        <div class="emblem">
          <span class="pulse"></span>
          <svg viewBox="0 0 156 156" aria-hidden="true">
            <defs>
              <linearGradient id="splash-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#86EFAC" />
                <stop offset="100%" stop-color="#16A34A" />
              </linearGradient>
            </defs>
            <circle class="track" cx="78" cy="78" r="70" />
            <circle class="arc" cx="78" cy="78" r="70" />
          </svg>
          <img class="mark" id="splash-logo" src="/brand/fitlife-mark.png" alt="FitLife" decoding="sync" />
        </div>
        <div class="word" aria-hidden="true">
          <span style="--i: 0">F</span><span style="--i: 1">i</span><span style="--i: 2">t</span><span class="g" style="--i: 3">L</span><span class="g" style="--i: 4">i</span><span class="g" style="--i: 5">f</span><span class="g" style="--i: 6">e</span>
        </div>
        <p class="tag">Ton corps. Ton alimentation. Ton coach.</p>
      </div>
      <p class="hint">Touchez pour passer</p>
    </div>
    <script>
      // L'animation démarre quand le logo est complètement décodé (au plus tard après 2 s).
      ;(function () {
        var splash = document.getElementById('splash')
        var logo = document.getElementById('splash-logo')
        var started = false
        function go() {
          if (started) return
          started = true
          window.__splashStartedAt = performance.now()
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { splash.classList.add('go') })
          })
        }
        function ready() {
          if (logo.decode) logo.decode().then(go, go)
          else go()
        }
        if (logo.complete && logo.naturalWidth > 0) ready()
        else {
          logo.addEventListener('load', ready)
          logo.addEventListener('error', go)
        }
        setTimeout(go, 2000)
        splash.addEventListener('click', function () {
          window.__splashSkip = true
          if (window.__hideSplash) window.__hideSplash()
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
